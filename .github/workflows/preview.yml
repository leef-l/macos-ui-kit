name: Preview

# Builds the static preview (frontend/preview/index.html) and publishes it to
# GitHub Pages. The build is deliberately separate from the Wails app: it runs
# the preview Vite config, which needs no Go toolchain and no Wails runtime.
on:
  push:
    branches: [main]
  # Lets the site be rebuilt without an empty commit.
  workflow_dispatch:

# Pages needs these three; contents:read is enough because nothing is pushed.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer commit supersedes an in-flight run, but do not
# cancel a deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The preview resolves @leef-l/macos-ui-kit to the package *source* through
      # a Vite alias, so the library needs no build step here.
      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build preview
        working-directory: frontend
        run: npm run build:preview

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
