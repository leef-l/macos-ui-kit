<body>

     document only needs an empty mount point. Keeping the markup out of here
     means the desktop and mobile shells can share one entry document. -->

<!-- Base document styles and the app-level layout that sits under the kit. -->
<link rel="stylesheet" href="/style.css"/>

</body>
